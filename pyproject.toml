[project]
name = "palet"
version = "1.0.0"
description = "Prompt-based Automated Literature Extraction Tool (AI-assisted scoping reviews)"
requires-python = ">=3.12"
license = { text = "MIT" }

# Runtime dependencies stay pinned in requirements.txt until the package
# layout is in place (WP1). Install dev tools with: pip install --group dev
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
# Only collect tests/: scripts/test_*.py are smoke scripts that call real APIs.
testpaths = ["tests"]
pythonpath = [".", "scripts"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
extend-exclude = ["legacy", "results", "outputs", "data", "runs"]

[tool.ruff.lint]
# Minimal rule set for WP0 (syntax errors and undefined names only).
# Widened progressively as modules are refactored.
select = ["E9", "F63", "F7", "F82"]
