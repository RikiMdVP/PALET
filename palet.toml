# PALET settings: model IDs, prices and limits live here, never in the code.
# Loaded by palet/config.py. Secrets (API keys, e-mail) go in .env instead.

[models]
# Exact Anthropic model ID used by each phase.
arq = "claude-opus-5-5"
qsp = "claude-opus-5-5"
map = "claude-opus-5-5"
synthesis = "claude-opus-5-5"

[pricing]
# Approximate conversion used only to display cost estimates in euros.
usd_to_eur = 0.92

# Model catalogue: every model PALET may use, with its list price in USD per
# million tokens. The dashboard offers these in its model selector.
# status: "current" or "legacy". Check prices again before relying on them:
#   https://platform.claude.com/docs/en/about-claude/pricing
[pricing.models."claude-opus-5-5"]
label = "Claude Opus 5.5"
status = "current"
input_per_mtok = 4.0
output_per_mtok = 20.0
note = "Verified 2026-11-11 (anthropic.com)."

[pricing.models."claude-sonnet-5-5"]
label = "Claude Sonnet 5.5"
status = "current"
input_per_mtok = 2.0
output_per_mtok = 10.0
note = "Verified 2026-11-11 (platform.claude.com)."

[pricing.models."claude-haiku-5-5"]
label = "Claude Haiku 5.5"
status = "current"
input_per_mtok = 0.10
output_per_mtok = 0.50
note = "Price for prompts up to 100K tokens (5x above that); PALET prompts are far smaller. From press coverage of the launch, 2026-11-11."

[pricing.models."claude-fable-5-2"]
label = "Claude Fable 5.2"
status = "current"
input_per_mtok = 8.0
output_per_mtok = 40.0
note = "PRICE NOT VERIFIED: single third-party source (2026-11-11). Check the official pricing page before using it."

# Model used up to PALET 1.0; kept so that earlier runs can be reproduced.
[pricing.models."claude-sonnet-4-6"]
label = "Claude Sonnet 4.6"
status = "legacy"
input_per_mtok = 3.0
output_per_mtok = 15.0
note = "Verified 2026-11-11 (anthropic.com)."

# Extra request parameters per model. Claude Opus 5.5 rejects temperature,
# top_p and top_k (HTTP 400) and always thinks before answering, so it takes
# none; older models keep temperature = 0 as before.
[model_options."claude-sonnet-4-6"]
temperature = 0

[limits]
# Maximum output tokens per call. With models that think before answering,
# the thinking counts against this limit, so it needs generous headroom
# (PALET 1.0 used 2000 / 1000 / 1500 / 4000 / 4000). It is a ceiling, not a
# spend: only the tokens actually produced are billed.
arq_max_tokens = 8000
qsp_max_tokens = 8000
map_max_tokens = 8000
synthesis_max_tokens = 16000
gaps_max_tokens = 16000
protocol_max_tokens = 12000
screen_max_tokens = 8000
assign_max_tokens = 8000
# Papers sent to the model per research question, and characters kept per abstract.
synthesis_max_papers_per_rq = 25
synthesis_max_abstract_chars = 1200

[search]
# OpenAlex accepts at most 100 results per page.
openalex_per_page = 100

[screening]
# Two independent screeners judge every record; what they do not agree on
# goes to a person. Method decision (2026-11-11, confirmed 2026-11-12): two
# different models. One screener alone is allowed (delete the second block or
# use `screen --screeners <model>`): its decisions are then final without any
# cross-check, and the report says so.
workers = 4

[[screening.screeners]]
name = "A"
model = "claude-opus-5-5"

[[screening.screeners]]
name = "B"
model = "claude-sonnet-5-5"

[assistant]
# Model of the protocol assistant (advice on research questions, draft criteria and searches).
model = "claude-opus-5-5"

[assignment]
# Model that charts the included records (research questions addressed, contribution).
model = "claude-opus-5-5"

